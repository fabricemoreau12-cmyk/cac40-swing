name: CAC40 Swing

on:
  schedule:
    # 17:45 UTC du lundi au vendredi = 18:45 (hiver) / 19:45 (été) à Bruxelles, après la clôture d'Euronext Paris
    - cron: "45 17 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cac40-swing
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Analyse CAC 40 + e-mail
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python src/cac40_swing.py --out data/cac40_swing.json --email

      - name: Publier le résultat dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/cac40_swing.json
          git diff --staged --quiet || git commit -m "CAC40 Swing $(date -u +%F)"
          git push
